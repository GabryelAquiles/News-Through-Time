name: Atualizar Google Trends Automático

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  atualizar-dados:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # Instala a SDK oficial do Gemini
      - name: Instalar Dependências
        run: pip install google-genai

      # Executa o script passando a chave dos Secrets

        run: python atualizar_trends.py

      - name: Salvar alterações no GitHub
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add trending_BR_latest.csv trending_US_latest.csv
          git diff --quiet && git diff --staged --quiet || (git commit -m "🔄 [BOT] Atualização automática do Google Trends" && git push)
