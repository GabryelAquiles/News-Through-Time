name: Atualizar Google Trends Automático

on:
  schedule:
    # Roda automaticamente a cada hora (no minuto 0)
    - cron: '0 * * * *'
  workflow_dispatch: # Permite executar manualmente no botão "Run workflow"

jobs:
  atualizar-dados:
    runs-on: ubuntu-latest

    permissions:
      contents: write # Dá permissão para o bot salvar e fazer push do CSV no repositório

    steps:
      # 1. Baixa os arquivos do seu repositório no servidor do GitHub
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      # 2. Configura o ambiente Python no servidor
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # 3. Executa o script Python passando a chave da API com segurança via Secret
      - name: Executar Script Python
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python atualizar_trends.py

      # 4. Faz o commit e o push dos novos arquivos CSV para o repositório
      - name: Salvar alterações no GitHub
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add trending_BR_latest.csv trending_US_latest.csv
          git diff --quiet && git diff --staged --quiet || (git commit -m "🔄 [BOT] Atualização automática do Google Trends" && git push)
