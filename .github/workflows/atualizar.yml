name: Atualização Automática dos Dados do Trends

on:
  schedule:
    # Executa todos os dias às 03:00 da manhã (Horário de Brasília / 06:00 UTC)
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  atualizar-dados:
    runs-on: ubuntu-latest

    steps:
    - name: Baixar Repositório
      uses: actions/checkout@v4

    - name: Configurar ambiente Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Instalar Dependências
      run: |
        python -m pip install --upgrade pip
        pip install pytrends pandas requests

    - name: Executar Script de Atualização
      run: python atualizar_trends.py

    - name: Salvar alterações no Repositório
      run: |
        git config --global user.name "GitHub Action Bot"
        git config --global user.email "actions@github.com"
        git add .
        git diff --staged --quiet || (git commit -m "🔄 [BOT] Atualização automática dos arquivos CSV" && git push)
