<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>News Through Time - Login</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #f4f8fa;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .login-card {
      background: #ffffff;
      padding: 40px 30px;
      border-radius: 20px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.04);
      text-align: center;
      width: 100%;
      max-width: 380px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }

    h2 {
      color: #5c7f91;
      font-size: 1.8rem;
      font-weight: 600;
      letter-spacing: -0.5px;
    }

    .subtitle {
      color: #718096;
      font-size: 0.95rem;
      margin-top: -10px;
    }

    .btn-google {
      background-color: #ffffff;
      color: #3c4043;
      border: 1px solid #AEC6CF;
      width: 100%;
      height: 48px;
      border-radius: 50px;
      cursor: pointer;
      font-size: 0.95rem;
      font-weight: 500;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      transition: background-color 0.2s, transform 0.1s;
    }

    .btn-google:hover {
      background-color: #f8fafc;
    }

    .btn-google:active {
      transform: scale(0.98);
    }

    .google-icon {
      width: 20px;
      height: 20px;
    }

    .message {
      font-size: 0.85rem;
      padding: 10px;
      border-radius: 8px;
      width: 100%;
      display: none;
    }

    .message.error {
      display: block;
      background-color: #fce8e6;
      color: #c53929;
    }

    .message.success {
      display: block;
      background-color: #e8f4f8;
      color: #4a7c8f;
    }
  </style>
</head>
<body>

  <main class="login-card">
    <h2>News Through Time</h2>
    <p class="subtitle">Faça login para acessar o resumo das tendências</p>

    <button id="btn-google" class="btn-google">
      <svg class="google-icon" viewBox="0 0 24 24">
        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
      </svg>
      Entrar com o Google
    </button>

    <div id="mensagem" class="message"></div>
  </main>

  <!-- Importante utilizar type="module" para o ES6 Imports -->
  <script type="module" src="app.js"></script>
</body>
</html>
